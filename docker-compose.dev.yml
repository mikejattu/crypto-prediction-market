#Basic Docker Compose file for development environment
#For reference only: Docker compose will create the database and setup redis

version: '3.8'
#services: define the different containers to be run
#each service is a separate container
#volumes: define persistent storage for the containers, basicallly where it will store data on the container host machine
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb_dev
    environment:
      - POSTGRES_DB=marketpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: marketpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
  
volumes:
  timescaledb_data:
  redis_data: 

# To run this compose file, use the command:
# docker-compose -f docker-compose.dev.yml up -d